[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI - PaperQA-inspired document intelligence backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.9.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
